name: CloudOps Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_resource_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_resource_exchange
          FLASK_APP: run.py
          PYTHONPATH: .
        run: |
          flask db upgrade

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_resource_exchange
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_resource_exchange
          SECRET_KEY: test-secret-key-32-bytes-minimum-security-required-12345
          S3_BUCKET_NAME: test-sentinel-bucket
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing-dummy-key
          AWS_SECRET_ACCESS_KEY: testing-dummy-secret
          ADMIN_USERNAME: testadmin
          ADMIN_PASSWORD: testpassword123
          ADMIN_EMAIL: testadmin@sentinel.local
        run: |
          pytest -v

  docker-build-test:
    name: Validate Multi-Stage Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: cloudops-sentinel:test

      - name: Container Smoke Test (Liveness Check)
        run: |
          docker run -d --name smoke-sentinel -p 5000:5000 \
            -e DATABASE_URL=postgresql+psycopg2://fake:fake@localhost:5432/fake \
            -e SECRET_KEY=test-smoke-secret-key-32-chars-minimum \
            -e S3_BUCKET_NAME=test-smoke-bucket \
            -e AWS_REGION=us-east-1 \
            cloudops-sentinel:test
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop smoke-sentinel
          docker rm smoke-sentinel

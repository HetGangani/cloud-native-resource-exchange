name: CloudOps Sentinel CD

# Automated push triggers are disabled by default until explicit approval for AWS deployment is granted.
# To re-enable automated deployment on push in the future, uncomment the push trigger below:
# on:
#   push:
#     branches: [ main ]
#     paths-ignore:
#       - 'README.md'
#       - 'docs/**'

on:
  workflow_dispatch:
    inputs:
      deploy_approval:
        description: 'Type "CONFIRM" to authorize deployment to AWS'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_approval == 'CONFIRM'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'cloudops-sentinel' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy Container and Migrate Database on EC2 Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'us-east-1' }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'cloudops-sentinel' }}:latest

            echo "Executing pending Alembic schema migrations against private RDS..."
            docker run --rm \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e FLASK_APP="run.py" \
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'cloudops-sentinel' }}:latest \
              flask db upgrade

            echo "Restarting application container; brief downtime may occur..."
            docker stop sentinel-web || true
            docker rm sentinel-web || true
            docker run -d \
              --name sentinel-web \
              --restart unless-stopped \
              -p 5000:5000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
              -e AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME || 'admin' }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL || 'INFO' }}" \
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'cloudops-sentinel' }}:latest
